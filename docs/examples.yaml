# Beispielkonfigurationen für die Energy Manager Card.
#
# Der Normalfall ist Beispiel 1: Mit der Energy Manager Integration braucht die
# Karte keine Konfiguration. Alles Weitere sind Darstellungsoptionen.
#
# Die Beispiele ab 3 zeigen den Betrieb OHNE Integration. Verbraucher lassen
# sich dort nur noch im YAML pflegen — der Editor bietet dafür keine Oberfläche
# mehr, weil sie in die Integration gehören.

# ---------------------------------------------------------------------------
# 1. Der Normalfall: Integration installiert
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
---
# ---------------------------------------------------------------------------
# 2. Mit Integration, für ein Tablet-Dashboard angepasst
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
title: PV-Überschuss
compact: true
show_priority: false
secondary_info: power
scale_max: 15000
---
# ---------------------------------------------------------------------------
# 3. Ohne Integration: nur Überschussanzeige
#
# Zählerquelle und Batterie muss die Karte dann selbst kennen. Verbraucher
# zeigt sie keine — die legt man in der Integration an.
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
title: PV-Überschuss
meter_mode: grid
grid_entity: sensor.netz_leistung
invert_grid: false

battery_soc_entity: sensor.hausbatterie_soc
battery_power_entity: sensor.hausbatterie_leistung
battery_min_soc: 20 # darunter hat das Laden Vorrang
battery_reserve_w: 300 # bleibt immer der Batterie vorbehalten

smoothing_window: 90 # s, gegen Wolkenflackern
update_interval: 5
---
# ---------------------------------------------------------------------------
# 4. Ohne Integration: getrennte Sensoren statt Netzzähler
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
meter_mode: split
production_entity: sensor.pv_erzeugung
consumption_entity: sensor.hausverbrauch
consumption_includes_battery: true
battery_power_entity: sensor.batterie_leistung
---
# ---------------------------------------------------------------------------
# 5. Bestandskonfiguration mit eigener Verbraucherliste
#
# Wird weiterhin dargestellt, lässt sich aber nur noch hier im YAML ändern.
# Die Zeitfelder setzt ohne Integration niemand durch — die Karte zeigt für
# min_runtime und min_off_time nur einen geschätzten Countdown.
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
grid_entity: sensor.netz_leistung
devices:
  # Reihenfolge = Priorität. Ganz oben wird zuerst eingeschaltet.
  - id: 6f1c0a2e-6a54-4b0e-9d3b-6b0f2a1c77aa
    switch_entity: switch.wallbox_freigabe
    power_entity: sensor.wallbox_leistung
    name: Wallbox
    icon: mdi:ev-station
    min_power: 4200 # dreiphasig 6 A — darunter lohnt es nicht
    max_power: 11000
    turn_on_delay: 120
    min_runtime: 900
    hysteresis: 300

  - id: 9b7e4d31-2c88-4f77-8f10-1a2d3c4b5e6f
    switch_entity: switch.heizstab
    power_entity: sensor.heizstab_leistung
    name: Heizstab
    icon: mdi:heat-wave
    min_power: 800
    max_power: 2000
    # Sortieren im Dashboard braucht bei ALLEN Verbrauchern eine solche
    # Entität — sonst wäre die neue Reihenfolge nach dem Neuladen wieder weg.
    priority_entity: input_number.prio_heizstab
    auto_entity: input_boolean.auto_heizstab

  - id: 4e2a8b90-1d67-4c33-b5f2-9a0e7c1d8b44
    switch_entity: switch.waschmaschine_steckdose
    name: Waschmaschine
    icon: mdi:washing-machine
    max_power: 2000
    managed: false # nur manuell schalten
    confirm: true # vorher nachfragen

# Beispielkonfigurationen für die Energy Manager Card.
# Alles davon lässt sich auch im grafischen Editor einstellen.

# ---------------------------------------------------------------------------
# 1. Minimal: ein bidirektionaler Netzsensor, zwei Verbraucher
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
title: PV-Überschuss
grid_entity: sensor.netz_leistung
devices:
  - id: 6f1c0a2e-6a54-4b0e-9d3b-6b0f2a1c77aa
    switch_entity: switch.heizstab
    power_entity: sensor.heizstab_leistung
    max_power: 2000
  - id: 9b7e4d31-2c88-4f77-8f10-1a2d3c4b5e6f
    switch_entity: switch.waschmaschine
    max_power: 2000
---
# ---------------------------------------------------------------------------
# 2. Vollausbau: Batterie, Glättung, alle Zeitfelder
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
title: PV-Überschuss
meter_mode: grid
grid_entity: sensor.netz_leistung
invert_grid: false

battery_soc_entity: sensor.hausbatterie_soc
battery_power_entity: sensor.hausbatterie_leistung
battery_min_soc: 20 # darunter hat das Laden Vorrang
battery_reserve_w: 300 # bleibt immer der Batterie vorbehalten

smoothing_window: 90 # s, gegen Wolkenflackern
update_interval: 5
scale_max: 15000
secondary_info: both

devices:
  # Reihenfolge = Priorität. Ganz oben wird zuerst eingeschaltet.
  - id: 6f1c0a2e-6a54-4b0e-9d3b-6b0f2a1c77aa
    switch_entity: switch.wallbox_freigabe
    power_entity: sensor.wallbox_leistung
    name: Wallbox
    icon: mdi:ev-station
    min_power: 4200 # dreiphasig 6 A — darunter lohnt es nicht
    max_power: 11000
    turn_on_delay: 120 # erst nach 2 min stabilem Überschuss starten
    min_runtime: 900 # dann aber mindestens 15 min laden
    hysteresis: 300

  - id: 9b7e4d31-2c88-4f77-8f10-1a2d3c4b5e6f
    switch_entity: switch.heizstab
    power_entity: sensor.heizstab_leistung
    name: Heizstab
    icon: mdi:heat-wave
    min_power: 800
    max_power: 2000
    min_runtime: 300

  - id: c30d5a17-8f42-4b91-a0cd-77e91b0a4d22
    switch_entity: switch.waermepumpe
    power_entity: sensor.waermepumpe_leistung
    name: Wärmepumpe
    icon: mdi:heat-pump
    max_power: 1800
    turn_off_delay: 180 # Wolke aussitzen statt abschalten
    min_runtime: 1200
    min_off_time: 600 # Kompressor-Druckausgleich abwarten

  - id: 4e2a8b90-1d67-4c33-b5f2-9a0e7c1d8b44
    switch_entity: switch.waschmaschine_steckdose
    name: Waschmaschine
    icon: mdi:washing-machine
    max_power: 2000
    managed: false # nur manuell schalten
    confirm: true # vorher nachfragen
---
# ---------------------------------------------------------------------------
# 3. Getrennte Sensoren statt Netzzähler
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
meter_mode: split
production_entity: sensor.pv_erzeugung
consumption_entity: sensor.hausverbrauch
consumption_includes_battery: true
battery_power_entity: sensor.batterie_leistung
devices:
  - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
    switch_entity: switch.poolpumpe
    power_entity: sensor.poolpumpe_leistung
    max_power: 900
    min_runtime: 3600
---
# ---------------------------------------------------------------------------
# 4. Kompakt für ein Tablet-Dashboard
# ---------------------------------------------------------------------------
type: custom:energy-manager-card
grid_entity: sensor.netz_leistung
compact: true
show_priority: false
secondary_info: power
smoothing_window: 30
devices:
  - id: 7f8e9d0c-1b2a-4c3d-9e8f-7a6b5c4d3e2f
    switch_entity: switch.heizstab
    power_entity: sensor.heizstab_leistung
    max_power: 2000

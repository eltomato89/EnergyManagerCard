name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Bundle muss eine einzelne, eigenständige Datei sein
        run: |
          test "$(find dist -name '*.js' | wc -l)" -eq 1
          ! grep -qE 'from"[^"]+"' dist/energy-manager-card.js

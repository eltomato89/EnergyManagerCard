name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Version aus dem Tag in package.json spiegeln, damit das Konsolen-Banner
      # der Karte nicht von der veroeffentlichten Version abweicht.
      - name: Version aus Tag übernehmen
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - run: npm run build

      # Der Vertrag nennt die Fassung, gegen die er geschrieben ist. Von Hand
      # nachgezogen wird sie genau einmal vergessen -- danach steht dort eine
      # Kartenfassung, die es nicht gibt. Geprueft wird nur die Karte: Die
      # genannte Integration ist eine Untergrenze und bleibt richtig, auch wenn
      # die Integration allein eine neue Fassung veroeffentlicht.
      - name: Vertrag nennt die veroeffentlichte Kartenfassung
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOKU=$(grep -A3 '<!-- version-pair -->' docs/integration-contract.md \
                 | grep -o '`[^`]*`' | head -1 | tr -d '`')
          test -n "$DOKU" || { echo "Zeile hinter <!-- version-pair --> nicht gefunden"; exit 1; }
          test "$DOKU" = "$VERSION" \
            || { echo "integration-contract.md nennt $DOKU, Tag ist $VERSION"; exit 1; }

      # Ohne dieses Flag landet eine Vorabfassung als regulaeres Release: GitHub
      # setzt sie auf "Latest", und HACS bietet sie damit allen an statt nur
      # denen, die Betas eingeschaltet haben. Massstab ist der Tag selbst --
      # reine x.y.z-Tags sind stabil, alles andere (0.4.0b3, 0.6.0-beta.2) nicht.
      - name: Vorabfassung am Tag erkennen
        id: art
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # Die Release-Notiz ist von Hand geschrieben und auf Englisch: Sie ist das,
      # was HACS beim Update anzeigt. Der CHANGELOG ist deutsch und ausfuehrlich
      # und taugt dafuer nicht. Geprueft wird, dass sie die Fassung nennt --
      # sonst stuende beim naechsten Release die Notiz des vorigen dort.
      - name: Release-Notiz nennt die veroeffentlichte Fassung
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q -- "$VERSION" RELEASE_NOTES.md \
            || { echo "RELEASE_NOTES.md nennt $VERSION nicht"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/energy-manager-card.js
          prerelease: ${{ steps.art.outputs.prerelease }}
